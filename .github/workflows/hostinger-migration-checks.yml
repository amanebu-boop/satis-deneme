name: Hostinger migration checks

on:
  push:
    branches:
      - infra/github-hostinger-pipeline
      - feature/**
  pull_request:
    branches:
      - main
      - infra/github-hostinger-pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-migration-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q
