name: Hostinger migration checks

on:
  push:
    branches:
      - infra/github-hostinger-pipeline
      - feature/**
  pull_request:
    branches:
      - main
      - infra/github-hostinger-pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-migration-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sales_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/sales_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install LibreOffice for document integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc fonts-liberation

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q
