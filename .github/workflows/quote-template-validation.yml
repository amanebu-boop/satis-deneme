name: Quote template validation

on:
  push:
    branches: [feature/quote-template-file, feature/company-address-meeting-products, feature/agent-runtime-readonly, feature/agent-controls, feature/report-readable-output, feature/agent-workflows-bundle, feature/meeting-to-quotation-approval, feature/agent-ui-template-modal-fix, feature/app-wide-http-dropdowns-pdf-fallback, feature/docker-date-picker-ui]
  pull_request:
    branches: [main, feature/agent-foundation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install LibreOffice for Excel-to-PDF integration test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc fonts-liberation
      - name: Install application and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run automated tests
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build --tag satis-deneme-test:ci .
