[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-ai-platform"
version = "0.1.0"
description = "Secure sales workspace prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0", "python-multipart>=0.0.20,<1.0", "python-docx>=1.1,<2.0", "openpyxl>=3.1,<4.0", "pypdf>=5.0,<7.0", "reportlab>=4.2,<5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
